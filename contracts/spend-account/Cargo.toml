[package]
name = "spend-account"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban contract account: daily USDC spend cap in __check_auth"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=22.0.0"

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
ed25519-dalek = { version = "1.0.1" }
rand = { version = "0.7.3" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
